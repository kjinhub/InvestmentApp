<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>김해 롯데워터파크 준비물 체크리스트</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:#0f172a;background:#e0f2fe}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff6ff 0,#f8fbff 40%,#fff 100%);min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0284c7,#22c55e);color:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 14px 34px rgba(2,132,199,.18)}h1{font-size:25px;line-height:1.25;margin:0 0 8px}.sub{font-size:14px;opacity:.92}.userRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:rgba(255,255,255,.17);padding:10px 12px;border-radius:14px}.userName{font-weight:800}.ghostBtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}.progressCard{margin-top:12px;background:rgba(255,255,255,.18);padding:12px;border-radius:16px}.progressTop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:#fff;border-radius:999px;transition:.2s}.section{margin-top:16px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.section h2{font-size:18px;margin:0 0 10px}.item{padding:14px 4px;border-bottom:1px solid #eef2f7}.item:last-child{border-bottom:0}.itemHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.txt{font-size:16px;line-height:1.4}.hint{display:block;font-size:12px;color:#64748b;margin-top:3px}.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;margin-left:6px;vertical-align:2px}.typeBadge{display:inline-block;font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:#e0f2fe;color:#0369a1;margin-left:6px}.deleteBtn{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 9px;font-size:12px;font-weight:800}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.checkCard{display:flex;align-items:center;gap:8px;border:1px solid #dbeafe;background:#f8fbff;border-radius:12px;padding:10px 11px;font-size:14px;font-weight:700}.checkCard input{width:21px;height:21px;accent-color:#0284c7}.checkedBy{font-size:11px;color:#0284c7;font-weight:800;display:block;margin-top:2px}.sharedDone{margin-top:10px;display:flex;align-items:center;gap:8px;background:#f8fbff;border:1px solid #dbeafe;border-radius:12px;padding:10px 11px}.sharedDone input{width:21px;height:21px;accent-color:#0284c7}.doneText{text-decoration:line-through;color:#94a3b8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px}.primary{background:#0ea5e9;color:#fff}.secondary{background:#e2e8f0;color:#334155}.addCard{margin-top:16px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.addGrid{display:grid;grid-template-columns:1fr;gap:8px}.textInput,.selectInput{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff}.addBtn{border:0;background:#0f172a;color:#fff;border-radius:12px;padding:13px 16px;font-weight:800}.tip{font-size:13px;color:#475569;line-height:1.55;margin-top:16px;background:#f8fafc;border-radius:16px;padding:14px}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalBox{width:min(430px,100%);background:#fff;border-radius:22px;padding:22px}.modalBox h3{margin:0 0 6px;font-size:22px}.modalBox p{margin:0 0 16px;color:#64748b;font-size:14px;line-height:1.5}.modalBtn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#0ea5e9;color:#fff;margin-top:10px}.nameGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.checks,.nameGrid{grid-template-columns:1fr}.userRow{align-items:flex-start;flex-direction:column}.ghostBtn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>💦 김해 롯데워터파크<br>커플 준비물 체크리스트</h1>
<div class="sub">8월 18일 화요일 · 각자 챙길 것과 공용 준비물을 따로 체크</div>
<div class="userRow"><div>현재 사용자 · <span class="userName" id="currentUser">-</span></div><button class="ghostBtn" id="changeNameBtn">이름 설정 변경</button></div>
<div class="progressCard"><div class="progressTop"><span>전체 준비 진행률</span><strong id="count">0 / 0</strong></div><div class="bar"><div id="bar"></div></div></div>
</section>
<div id="sections"></div>
<section class="addCard">
<h2>➕ 체크리스트 추가</h2>
<div class="addGrid">
<input class="textInput" id="newItemInput" maxlength="40" placeholder="예: 립밤, 슬리퍼, 여분 수건" />
<select class="selectInput" id="newItemType">
<option value="both">둘 다 챙겨야 함</option>
<option value="me">나만 챙김</option>
<option value="partner">상대만 챙김</option>
<option value="shared">공용 준비물</option>
</select>
<button class="addBtn" id="addItemBtn">항목 추가</button>
</div>
</section>
<div class="actions"><button class="btn primary" id="checkMine">내 준비물 전체 체크</button><button class="btn secondary" id="reset">체크 초기화</button></div>
<div class="tip">수영복·속옷·갈아입을 옷처럼 각자 필요한 물건은 두 사람 체크칸이 따로 표시됩니다. 방수팩이나 보조배터리처럼 하나만 있으면 되는 물건은 공용으로 설정할 수 있습니다.</div>
<div class="footer">현재 버전은 이 브라우저에 자동 저장됩니다.</div>
</div>
<div class="modal" id="nicknameModal"><div class="modalBox"><h3>두 사람 이름을 정해주세요</h3><p>각 항목에서 누가 준비했는지 구분하기 위해 사용합니다.</p><div class="nameGrid"><input class="textInput" id="myNameInput" maxlength="12" placeholder="내 닉네임"><input class="textInput" id="partnerNameInput" maxlength="12" placeholder="상대 닉네임"></div><button class="modalBtn" id="saveNamesBtn">저장하고 시작하기</button></div></div>
<script>
const KEY='gimhae-waterpark-couple-v3';
const oldKey='gimhae-waterpark-collab-v2';
const defaults=[
['ticket','🎫 입장 전 필수','모바일/온라인 입장권','shared','예매 화면 또는 QR 미리 확인','필수'],
['id','🎫 입장 전 필수','신분증','both','본인 확인이 필요한 경우 대비',''],
['card','🎫 입장 전 필수','카드 또는 소액 현금','shared','식사·대여·락커 비용 대비',''],
['phone','🎫 입장 전 필수','휴대폰','both','',''],
['swim','🩱 물놀이 용품','수영복 / 래시가드','both','','필수'],
['cap','🩱 물놀이 용품','수영모·캡모자','both','현장 규정 확인용으로 챙겨두기',''],
['aqua','🩱 물놀이 용품','아쿠아슈즈','both','뜨거운 바닥과 미끄럼 방지',''],
['goggles','🩱 물놀이 용품','물안경','both','',''],
['watercase','🩱 물놀이 용품','휴대폰 방수팩','both','','추천'],
['sun','🧴 피부·샤워','워터프루프 선크림','shared','야외 시설 이용 전 충분히 바르기','추천'],
['wash','🧴 피부·샤워','샴푸·린스·바디워시','shared','작은 여행용 용기에 담으면 편함',''],
['cleanser','🧴 피부·샤워','클렌징폼 / 클렌징 제품','partner','',''],
['skin','🧴 피부·샤워','스킨·로션·기초 화장품','both','',''],
['towel','🧴 피부·샤워','개인 수건','both','',''],
['under','👕 갈아입을 옷','속옷','both','','필수'],
['clothes','👕 갈아입을 옷','갈아입을 옷','both','',''],
['socks','👕 갈아입을 옷','양말','both','',''],
['bag','👕 갈아입을 옷','젖은 옷 담을 비닐/방수백','shared','','추천'],
['battery','🔋 있으면 편한 것','보조배터리','shared','사진 많이 찍을 경우 추천',''],
['hair','🔋 있으면 편한 것','머리끈·빗','partner','',''],
['glasses','🔋 있으면 편한 것','안경 케이스 / 렌즈용품','both','',''],
['med','🔋 있으면 편한 것','개인 상비약·밴드','shared','',''],
['water','🔋 있으면 편한 것','마실 물','shared','반입 규정에 맞는 용기인지 현장 규정 확인','']
].map(([id,section,text,type,hint,badge])=>({id,section,text,type,hint,badge,checks:{me:false,partner:false,shared:false},checkedBy:{me:'',partner:'',shared:''}}));
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items))return s}catch(e){}return {myName:'',partnerName:'',items:JSON.parse(JSON.stringify(defaults))}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function typeLabel(t){return t==='both'?'둘 다':t==='me'?'나만':t==='partner'?'상대만':'공용'}
function relevant(item){if(item.type==='both')return ['me','partner'];if(item.type==='me')return ['me'];if(item.type==='partner')return ['partner'];return ['shared']}
function isDone(item){return relevant(item).every(k=>item.checks[k])}
function nameFor(k){return k==='me'?(state.myName||'나'):k==='partner'?(state.partnerName||'상대'):'공용'}
function render(){document.getElementById('currentUser').textContent=state.myName||'-';const groups={};state.items.forEach(i=>(groups[i.section]??=[]).push(i));const order=['🎫 입장 전 필수','🩱 물놀이 용품','🧴 피부·샤워','👕 갈아입을 옷','🔋 있으면 편한 것','➕ 추가한 준비물'];sections.innerHTML=order.filter(s=>groups[s]?.length).map(section=>`<section class="section"><h2>${esc(section)}</h2>${groups[section].map(item=>itemHtml(item)).join('')}</section>`).join('');bind();progress()}
function itemHtml(item){const done=isDone(item);const main=`<div class="itemHead"><div class="txt ${done?'doneText':''}">${esc(item.text)}${item.badge?`<span class="badge">${esc(item.badge)}</span>`:''}<span class="typeBadge">${typeLabel(item.type)}</span>${item.hint?`<span class="hint">${esc(item.hint)}</span>`:''}</div><button class="deleteBtn" data-del="${esc(item.id)}">삭제</button></div>`;if(item.type==='shared')return `<div class="item" data-id="${esc(item.id)}">${main}<label class="sharedDone"><input type="checkbox" data-role="shared" ${item.checks.shared?'checked':''}><span>공용 준비 완료${item.checks.shared&&item.checkedBy.shared?`<span class="checkedBy">✓ ${esc(item.checkedBy.shared)} 님이 체크함</span>`:''}</span></label></div>`;const ks=relevant(item);return `<div class="item" data-id="${esc(item.id)}">${main}<div class="checks">${ks.map(k=>`<label class="checkCard"><input type="checkbox" data-role="${k}" ${item.checks[k]?'checked':''}><span>${esc(nameFor(k))}${item.checks[k]&&item.checkedBy[k]?`<span class="checkedBy">✓ ${esc(item.checkedBy[k])} 체크</span>`:''}</span></label>`).join('')}</div></div>`}
function bind(){document.querySelectorAll('.item').forEach(row=>{const item=state.items.find(x=>x.id===row.dataset.id);row.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.role;item.checks[k]=cb.checked;item.checkedBy[k]=cb.checked?(k==='partner'?(state.partnerName||'상대'):(state.myName||'나')):'';save();render()})});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const item=state.items.find(x=>x.id===b.dataset.del);if(confirm(`'${item.text}' 항목을 삭제할까요?`)){state.items=state.items.filter(x=>x.id!==item.id);save();render()}})}
function progress(){const tasks=state.items.flatMap(i=>relevant(i).map(k=>({i,k})));const done=tasks.filter(x=>x.i.checks[x.k]).length;count.textContent=`${done} / ${tasks.length}`;bar.style.width=tasks.length?`${Math.round(done/tasks.length*100)}%`:'0%'}
addItemBtn.onclick=()=>{const text=newItemInput.value.trim();if(!text)return alert('추가할 준비물을 입력해주세요.');state.items.push({id:'u'+Date.now(),section:'➕ 추가한 준비물',text,type:newItemType.value,hint:'',badge:'',checks:{me:false,partner:false,shared:false},checkedBy:{me:'',partner:'',shared:''}});newItemInput.value='';save();render()};newItemInput.onkeydown=e=>{if(e.key==='Enter')addItemBtn.click()};checkMine.onclick=()=>{state.items.forEach(i=>{if(['both','me'].includes(i.type)){i.checks.me=true;i.checkedBy.me=state.myName||'나'}});save();render()};reset.onclick=()=>{if(!confirm('모든 체크 기록을 초기화할까요?'))return;state.items.forEach(i=>{i.checks={me:false,partner:false,shared:false};i.checkedBy={me:'',partner:'',shared:''}});save();render()};function openNames(){myNameInput.value=state.myName||'';partnerNameInput.value=state.partnerName||'';nicknameModal.classList.add('show')}changeNameBtn.onclick=openNames;saveNamesBtn.onclick=()=>{const me=myNameInput.value.trim(),partner=partnerNameInput.value.trim();if(!me||!partner)return alert('두 사람 닉네임을 모두 입력해주세요.');state.myName=me;state.partnerName=partner;save();nicknameModal.classList.remove('show');render()};render();if(!state.myName||!state.partnerName)openNames();
</script>
</body>
</html>
