<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>김해 롯데워터파크 준비물 체크리스트</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:#0f172a;background:#e0f2fe}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff6ff 0,#f8fbff 40%,#fff 100%);min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0284c7,#22c55e);color:white;border-radius:24px;padding:22px 18px;box-shadow:0 14px 34px rgba(2,132,199,.18)}h1{font-size:25px;line-height:1.25;margin:0 0 8px}.sub{font-size:14px;opacity:.92}.userRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:rgba(255,255,255,.17);padding:10px 12px;border-radius:14px}.userName{font-weight:800}.ghostBtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}.progressCard{margin-top:12px;background:rgba(255,255,255,.18);padding:12px;border-radius:16px}.progressTop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:white;border-radius:999px;transition:.2s}.section{margin-top:16px;background:white;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:18px;margin:0 0 10px}.item{display:grid;grid-template-columns:28px 1fr auto;align-items:start;gap:10px;padding:13px 4px;border-bottom:1px solid #eef2f7}.item:last-child{border-bottom:none}.item input[type=checkbox]{width:23px;height:23px;accent-color:#0284c7;margin-top:1px}.txt{font-size:16px;line-height:1.4}.hint{display:block;font-size:12px;color:#64748b;margin-top:3px}.checkedBy{display:block;font-size:12px;color:#0284c7;font-weight:700;margin-top:5px}.item.done .txtMain{text-decoration:line-through;color:#94a3b8}.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;margin-left:6px;vertical-align:2px}.deleteBtn{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 9px;font-size:12px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#0ea5e9;color:#fff}.secondary{background:#e2e8f0;color:#334155}.addCard{margin-top:16px;background:white;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.addRow{display:grid;grid-template-columns:1fr auto;gap:8px}.textInput{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}.textInput:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}.addBtn{border:0;background:#0f172a;color:white;border-radius:12px;padding:0 16px;font-weight:800}.tip{font-size:13px;color:#475569;line-height:1.55;margin-top:16px;background:#f8fafc;border-radius:16px;padding:14px}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalBox{width:min(420px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.modalBox h3{margin:0 0 6px;font-size:22px}.modalBox p{margin:0 0 16px;color:#64748b;font-size:14px;line-height:1.5}.modalActions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.modalBtn{border:0;border-radius:12px;padding:13px;font-weight:800;background:#0ea5e9;color:#fff}.notice{font-size:12px;color:#64748b;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>💦 김해 롯데워터파크<br>커플 준비물 체크리스트</h1>
    <div class="sub">8월 18일 화요일 · 같이 준비하고 체크하기</div>
    <div class="userRow"><div>현재 사용자 · <span class="userName" id="currentUser">-</span></div><button class="ghostBtn" id="changeNameBtn">닉네임 변경</button></div>
    <div class="progressCard">
      <div class="progressTop"><span>준비 진행률</span><strong id="count">0 / 0</strong></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
  </section>

  <div id="sections"></div>

  <section class="addCard">
    <h2>➕ 체크리스트 추가</h2>
    <div class="addRow">
      <input class="textInput" id="newItemInput" maxlength="40" placeholder="예: 선글라스, 립밤, 슬리퍼" />
      <button class="addBtn" id="addItemBtn">추가</button>
    </div>
    <div class="notice">추가한 항목은 ‘추가한 준비물’에 표시됩니다.</div>
  </section>

  <div class="actions"><button class="btn primary" id="all">전체 체크</button><button class="btn secondary" id="reset">체크 초기화</button></div>
  <div class="tip">💡 체크하면 <b>누가 체크했는지 닉네임</b>이 항목 아래에 표시됩니다. 삭제 버튼을 누르면 해당 항목을 목록에서 제거할 수 있습니다.</div>
  <div class="footer">현재 버전은 이 브라우저에 자동 저장됩니다.</div>
</div>

<div class="modal" id="nicknameModal">
  <div class="modalBox">
    <h3>닉네임을 정해주세요</h3>
    <p>체크한 사람을 구분하기 위해 사용할 이름입니다.</p>
    <input class="textInput" id="nicknameInput" maxlength="12" placeholder="예: 국진, 여자친구" />
    <div class="modalActions"><button class="modalBtn" id="saveNicknameBtn">시작하기</button></div>
  </div>
</div>

<script>
const STORAGE_KEY='gimhae-waterpark-collab-v2';
const defaultData={
 nickname:'',
 items:[
  {id:'ticket',section:'🎫 입장 전 필수',text:'모바일/온라인 입장권',hint:'예매 화면 또는 QR 미리 확인',badge:'필수',checked:false,checkedBy:''},
  {id:'id',section:'🎫 입장 전 필수',text:'신분증',hint:'본인 확인이 필요한 경우 대비',checked:false,checkedBy:''},
  {id:'card',section:'🎫 입장 전 필수',text:'카드 또는 소액 현금',hint:'식사·대여·락커 비용 대비',checked:false,checkedBy:''},
  {id:'phone',section:'🎫 입장 전 필수',text:'휴대폰',checked:false,checkedBy:''},
  {id:'swim',section:'🩱 물놀이 용품',text:'수영복 / 래시가드',badge:'필수',checked:false,checkedBy:''},
  {id:'cap',section:'🩱 물놀이 용품',text:'수영모·캡모자',hint:'현장 규정 확인용으로 챙겨두기',checked:false,checkedBy:''},
  {id:'aqua',section:'🩱 물놀이 용품',text:'아쿠아슈즈',hint:'뜨거운 바닥과 미끄럼 방지',checked:false,checkedBy:''},
  {id:'goggles',section:'🩱 물놀이 용품',text:'물안경',checked:false,checkedBy:''},
  {id:'watercase',section:'🩱 물놀이 용품',text:'휴대폰 방수팩',badge:'추천',checked:false,checkedBy:''},
  {id:'sun',section:'🧴 피부·샤워',text:'워터프루프 선크림',hint:'야외 시설 이용 전 충분히 바르기',badge:'추천',checked:false,checkedBy:''},
  {id:'wash',section:'🧴 피부·샤워',text:'샴푸·린스·바디워시',hint:'작은 여행용 용기에 담으면 편함',checked:false,checkedBy:''},
  {id:'cleanser',section:'🧴 피부·샤워',text:'클렌징폼 / 여성용 클렌징 제품',checked:false,checkedBy:''},
  {id:'skin',section:'🧴 피부·샤워',text:'스킨·로션·기초 화장품',checked:false,checkedBy:''},
  {id:'towel',section:'🧴 피부·샤워',text:'개인 수건',checked:false,checkedBy:''},
  {id:'under',section:'👕 갈아입을 옷',text:'속옷',badge:'필수',checked:false,checkedBy:''},
  {id:'clothes',section:'👕 갈아입을 옷',text:'갈아입을 옷',checked:false,checkedBy:''},
  {id:'socks',section:'👕 갈아입을 옷',text:'양말',checked:false,checkedBy:''},
  {id:'bag',section:'👕 갈아입을 옷',text:'젖은 옷 담을 비닐/방수백',badge:'추천',checked:false,checkedBy:''},
  {id:'battery',section:'🔋 있으면 편한 것',text:'보조배터리',hint:'사진 많이 찍을 경우 추천',checked:false,checkedBy:''},
  {id:'hair',section:'🔋 있으면 편한 것',text:'머리끈·빗',checked:false,checkedBy:''},
  {id:'glasses',section:'🔋 있으면 편한 것',text:'안경 케이스 / 렌즈용품',checked:false,checkedBy:''},
  {id:'med',section:'🔋 있으면 편한 것',text:'개인 상비약·밴드',checked:false,checkedBy:''},
  {id:'water',section:'🔋 있으면 편한 것',text:'마실 물',hint:'반입 규정에 맞는 용기인지 현장 규정 확인',checked:false,checkedBy:''}
 ]
};

let state=loadState();
function loadState(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(saved&&Array.isArray(saved.items)) return saved;
 }catch(e){}
 return JSON.parse(JSON.stringify(defaultData));
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(){
 document.getElementById('currentUser').textContent=state.nickname||'-';
 const groups={};
 state.items.forEach(item=>(groups[item.section]??=[]).push(item));
 const order=['🎫 입장 전 필수','🩱 물놀이 용품','🧴 피부·샤워','👕 갈아입을 옷','🔋 있으면 편한 것','➕ 추가한 준비물'];
 document.getElementById('sections').innerHTML=order.filter(k=>groups[k]?.length).map(section=>`<section class="section"><div class="sectionTitle"><h2>${esc(section)}</h2></div>${groups[section].map(item=>`<div class="item ${item.checked?'done':''}" data-id="${esc(item.id)}"><input type="checkbox" ${item.checked?'checked':''} aria-label="${esc(item.text)}"><div class="txt"><div class="txtMain">${esc(item.text)}${item.badge?` <span class="badge">${esc(item.badge)}</span>`:''}</div>${item.hint?`<span class="hint">${esc(item.hint)}</span>`:''}${item.checked&&item.checkedBy?`<span class="checkedBy">✓ ${esc(item.checkedBy)} 님이 체크함</span>`:''}</div><button class="deleteBtn" type="button">삭제</button></div>`).join('')}</section>`).join('');
 bindItems(); updateProgress();
}
function bindItems(){
 document.querySelectorAll('.item').forEach(row=>{
  const id=row.dataset.id;
  row.querySelector('input').addEventListener('change',e=>{
   const item=state.items.find(x=>x.id===id); if(!item)return;
   item.checked=e.target.checked;
   item.checkedBy=e.target.checked?state.nickname:'';
   saveState(); render();
  });
  row.querySelector('.deleteBtn').addEventListener('click',()=>{
   const item=state.items.find(x=>x.id===id); if(!item)return;
   if(confirm(`'${item.text}' 항목을 삭제할까요?`)){
    state.items=state.items.filter(x=>x.id!==id); saveState(); render();
   }
  });
 });
}
function updateProgress(){
 const total=state.items.length, done=state.items.filter(x=>x.checked).length;
 document.getElementById('count').textContent=`${done} / ${total}`;
 document.getElementById('bar').style.width=total?`${Math.round(done/total*100)}%`:'0%';
}
function openNickname(){
 const modal=document.getElementById('nicknameModal');
 document.getElementById('nicknameInput').value=state.nickname||'';
 modal.classList.add('show'); setTimeout(()=>document.getElementById('nicknameInput').focus(),80);
}
function saveNickname(){
 const name=document.getElementById('nicknameInput').value.trim();
 if(!name){alert('닉네임을 입력해주세요.');return;}
 state.nickname=name; saveState(); document.getElementById('nicknameModal').classList.remove('show'); render();
}
function addItem(){
 const input=document.getElementById('newItemInput'); const text=input.value.trim();
 if(!text){alert('추가할 준비물을 입력해주세요.');return;}
 state.items.push({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),section:'➕ 추가한 준비물',text,checked:false,checkedBy:''});
 input.value=''; saveState(); render();
}

document.getElementById('saveNicknameBtn').onclick=saveNickname;
document.getElementById('nicknameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveNickname();});
document.getElementById('changeNameBtn').onclick=openNickname;
document.getElementById('addItemBtn').onclick=addItem;
document.getElementById('newItemInput').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});
document.getElementById('all').onclick=()=>{state.items.forEach(x=>{x.checked=true;x.checkedBy=state.nickname;});saveState();render();};
document.getElementById('reset').onclick=()=>{if(confirm('모든 체크를 해제할까요?')){state.items.forEach(x=>{x.checked=false;x.checkedBy='';});saveState();render();}};

render();
if(!state.nickname) openNickname();
</script>
</body>
</html>
