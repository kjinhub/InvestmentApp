<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>김해 롯데워터파크 준비물 체크리스트</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:#0f172a;background:#e0f2fe}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff6ff 0,#f8fbff 40%,#fff 100%);min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0284c7,#22c55e);color:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 14px 34px rgba(2,132,199,.18)}h1{font-size:25px;line-height:1.25;margin:0 0 8px}.sub{font-size:14px;opacity:.92}.userRow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:14px;background:rgba(255,255,255,.17);padding:10px 12px;border-radius:14px}.userNames{font-size:14px;line-height:1.5}.userNames b{font-size:15px}.ghostBtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}.progressCard{margin-top:12px;background:rgba(255,255,255,.18);padding:12px;border-radius:16px}.progressTop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:#fff;border-radius:999px;transition:.2s}.section,.addCard{margin-top:16px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.section h2,.addCard h2{font-size:18px;margin:0 0 10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 4px;border-bottom:1px solid #eef2f7;align-items:start}.item:last-child{border-bottom:none}.item.done .txtMain{text-decoration:line-through;color:#94a3b8}.txt{font-size:16px;line-height:1.4}.hint{display:block;font-size:12px;color:#64748b;margin-top:3px}.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;margin-left:6px;vertical-align:2px}.bothDone{display:block;font-size:12px;color:#16a34a;font-weight:800;margin-top:5px}.checkArea{display:grid;gap:8px;min-width:148px}.checkRow{display:flex;align-items:center;gap:8px;justify-content:flex-start;background:#f8fafc;border-radius:12px;padding:7px 10px}.checkRow input{width:20px;height:20px;accent-color:#0284c7;flex:0 0 auto}.checkLabel{font-size:13px;font-weight:700;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}.metaActions{display:flex;justify-content:flex-end;margin-top:8px}.deleteBtn{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 9px;font-size:12px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#0ea5e9;color:#fff}.secondary{background:#e2e8f0;color:#334155}.addGrid{display:grid;grid-template-columns:1fr auto;gap:8px}.textInput{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}.textInput:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}.addBtn{border:0;background:#0f172a;color:#fff;border-radius:12px;padding:0 16px;font-weight:800}.notice{font-size:12px;color:#64748b;margin-top:8px}.tip{font-size:13px;color:#475569;line-height:1.55;margin-top:16px;background:#f8fafc;border-radius:16px;padding:14px}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalBox{width:min(420px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.modalBox h3{margin:0 0 6px;font-size:22px}.modalBox p{margin:0 0 16px;color:#64748b;font-size:14px;line-height:1.5}.modalActions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.modalBtn{border:0;border-radius:12px;padding:13px;font-weight:800;background:#0ea5e9;color:#fff}@media(max-width:620px){.item{grid-template-columns:1fr}.checkArea{grid-template-columns:1fr 1fr;min-width:0}.checkLabel{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>💦 김해 롯데워터파크<br>커플 준비물 체크리스트</h1>
<div class="sub">모든 항목을 두 사람이 각각 체크할 수 있는 버전</div>
<div class="userRow"><div class="userNames">현재 사용자 · <b id="name1Text">-</b></div><button class="ghostBtn" id="changeNamesBtn">닉네임 변경</button></div>
<div class="progressCard"><div class="progressTop"><span>완료된 개인 체크 수</span><strong id="count">0 / 0</strong></div><div class="bar"><div id="bar"></div></div></div>
</section>
<div id="sections"></div>
<section class="addCard"><h2>➕ 체크리스트 추가</h2><div class="addGrid"><input class="textInput" id="newItemInput" maxlength="40" placeholder="예: 선글라스, 슬리퍼, 립밤"/><button class="addBtn" id="addItemBtn">추가</button></div><div class="notice">추가한 항목도 자동으로 두 사람 각각 체크할 수 있습니다.</div></section>
<div class="actions"><button class="btn primary" id="all">모든 항목 둘 다 체크</button><button class="btn secondary" id="reset">전체 초기화</button></div>
<div class="tip">💡 항목이 공용인지 개인용인지 미리 정하지 않아도 됩니다. 모든 항목에 <b>내 체크 / 상대방 체크</b> 두 칸이 표시됩니다.</div>
<div class="footer">현재 버전은 이 브라우저에 자동 저장됩니다.</div>
</div>
<div class="modal" id="namesModal"><div class="modalBox"><h3>내 닉네임을 정해주세요</h3><p>이 기기에서 체크할 때 표시될 이름입니다. 상대방 닉네임은 입력하지 않아도 됩니다.</p><input class="textInput" id="name1Input" maxlength="12" placeholder="예: 국진"/><div class="modalActions"><button class="modalBtn" id="saveNamesBtn">저장하기</button></div></div></div>
<script>
const STORAGE_KEY='gimhae-waterpark-collab-v5';
const DEFAULT_DATA={users:{one:'',two:'상대방'},items:[
{id:'ticket',section:'🎫 입장 전 필수',text:'모바일/온라인 입장권',hint:'예매 화면 또는 QR 미리 확인',badge:'필수',checks:{one:false,two:false}},
{id:'id',section:'🎫 입장 전 필수',text:'신분증',hint:'본인 확인이 필요한 경우 대비',checks:{one:false,two:false}},
{id:'card',section:'🎫 입장 전 필수',text:'카드 또는 소액 현금',hint:'식사·대여·락커 비용 대비',checks:{one:false,two:false}},
{id:'phone',section:'🎫 입장 전 필수',text:'휴대폰',checks:{one:false,two:false}},
{id:'swim',section:'🩱 물놀이 용품',text:'수영복 / 래시가드',badge:'필수',checks:{one:false,two:false}},
{id:'cap',section:'🩱 물놀이 용품',text:'수영모·캡모자',hint:'현장 규정 확인용으로 챙겨두기',checks:{one:false,two:false}},
{id:'aqua',section:'🩱 물놀이 용품',text:'아쿠아슈즈',hint:'뜨거운 바닥과 미끄럼 방지',checks:{one:false,two:false}},
{id:'goggles',section:'🩱 물놀이 용품',text:'물안경',checks:{one:false,two:false}},
{id:'watercase',section:'🩱 물놀이 용품',text:'휴대폰 방수팩',badge:'추천',checks:{one:false,two:false}},
{id:'sun',section:'🧴 피부·샤워',text:'워터프루프 선크림',hint:'야외 시설 이용 전 충분히 바르기',badge:'추천',checks:{one:false,two:false}},
{id:'wash',section:'🧴 피부·샤워',text:'샴푸·린스·바디워시',hint:'작은 여행용 용기에 담으면 편함',checks:{one:false,two:false}},
{id:'cleanser',section:'🧴 피부·샤워',text:'클렌징폼 / 여성용 클렌징 제품',checks:{one:false,two:false}},
{id:'skin',section:'🧴 피부·샤워',text:'스킨·로션·기초 화장품',checks:{one:false,two:false}},
{id:'towel',section:'🧴 피부·샤워',text:'개인 수건',checks:{one:false,two:false}},
{id:'under',section:'👕 갈아입을 옷',text:'속옷',badge:'필수',checks:{one:false,two:false}},
{id:'clothes',section:'👕 갈아입을 옷',text:'갈아입을 옷',checks:{one:false,two:false}},
{id:'socks',section:'👕 갈아입을 옷',text:'양말',checks:{one:false,two:false}},
{id:'bag',section:'👕 갈아입을 옷',text:'젖은 옷 담을 비닐/방수백',badge:'추천',checks:{one:false,two:false}},
{id:'battery',section:'🔋 있으면 편한 것',text:'보조배터리',hint:'사진 많이 찍을 경우 추천',checks:{one:false,two:false}},
{id:'hair',section:'🔋 있으면 편한 것',text:'머리끈·빗',checks:{one:false,two:false}},
{id:'glasses',section:'🔋 있으면 편한 것',text:'안경 케이스 / 렌즈용품',checks:{one:false,two:false}},
{id:'med',section:'🔋 있으면 편한 것',text:'개인 상비약·밴드',checks:{one:false,two:false}},
{id:'water',section:'🔋 있으면 편한 것',text:'마실 물',hint:'반입 규정에 맞는 용기인지 현장 규정 확인',checks:{one:false,two:false}}
]};
let state=loadState();
function clone(v){return JSON.parse(JSON.stringify(v))}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&Array.isArray(s.items))return s}catch(e){}return clone(DEFAULT_DATA)}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function displayName(k){return k==='one'?(state.users.one||'나'):'상대방'}
function render(){name1Text.textContent=displayName('one');const groups={};state.items.forEach(i=>(groups[i.section]??=[]).push(i));const order=['🎫 입장 전 필수','🩱 물놀이 용품','🧴 피부·샤워','👕 갈아입을 옷','🔋 있으면 편한 것','➕ 추가한 준비물'];sections.innerHTML=order.filter(k=>groups[k]?.length).map(s=>`<section class="section"><h2>${esc(s)}</h2>${groups[s].map(itemHtml).join('')}</section>`).join('');bindItems();updateProgress()}
function itemHtml(i){const done=i.checks.one&&i.checks.two;return `<div class="item ${done?'done':''}" data-id="${esc(i.id)}"><div><div class="txt"><div class="txtMain">${esc(i.text)}${i.badge?` <span class="badge">${esc(i.badge)}</span>`:''}</div>${i.hint?`<span class="hint">${esc(i.hint)}</span>`:''}${done?'<span class="bothDone">✓ 두 사람 모두 준비 완료</span>':''}</div><div class="metaActions"><button class="deleteBtn">삭제</button></div></div><div class="checkArea"><label class="checkRow"><input type="checkbox" data-user="one" ${i.checks.one?'checked':''}><span class="checkLabel">${esc(displayName('one'))}</span></label><label class="checkRow"><input type="checkbox" data-user="two" ${i.checks.two?'checked':''}><span class="checkLabel">상대방</span></label></div></div>`}
function bindItems(){document.querySelectorAll('.item').forEach(row=>{const id=row.dataset.id;row.querySelectorAll('input[type=checkbox]').forEach(box=>box.onchange=e=>{const item=state.items.find(x=>x.id===id);item.checks[e.target.dataset.user]=e.target.checked;saveState();render()});row.querySelector('.deleteBtn').onclick=()=>{const item=state.items.find(x=>x.id===id);if(confirm(`'${item.text}' 항목을 삭제할까요?`)){state.items=state.items.filter(x=>x.id!==id);saveState();render()}}})}
function updateProgress(){const total=state.items.length*2,done=state.items.reduce((n,i)=>n+(i.checks.one?1:0)+(i.checks.two?1:0),0);count.textContent=`${done} / ${total}`;bar.style.width=total?`${Math.round(done/total*100)}%`:'0%'}
function openModal(){name1Input.value=state.users.one||'';namesModal.classList.add('show')}
function saveName(){const one=name1Input.value.trim();if(!one){alert('닉네임을 입력해주세요.');return}state.users.one=one;state.users.two='상대방';saveState();namesModal.classList.remove('show');render()}
function addItem(){const text=newItemInput.value.trim();if(!text){alert('추가할 준비물을 입력해주세요.');return}state.items.push({id:'add-'+Date.now(),section:'➕ 추가한 준비물',text,hint:'',badge:'',checks:{one:false,two:false}});newItemInput.value='';saveState();render()}
saveNamesBtn.onclick=saveName;changeNamesBtn.onclick=openModal;addItemBtn.onclick=addItem;newItemInput.onkeydown=e=>{if(e.key==='Enter')addItem()};all.onclick=()=>{state.items.forEach(i=>{i.checks.one=true;i.checks.two=true});saveState();render()};reset.onclick=()=>{if(confirm('모든 체크를 초기화할까요?')){state.items.forEach(i=>{i.checks.one=false;i.checks.two=false});saveState();render()}};render();if(!state.users.one)openModal();
</script>
</body>
</html>
