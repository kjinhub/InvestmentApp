<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>김해 롯데워터파크 준비물 체크리스트</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:#0f172a;background:#e0f2fe}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff6ff,#f8fbff 42%,#fff);min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0284c7,#22c55e);color:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 14px 34px rgba(2,132,199,.18)}h1{font-size:25px;line-height:1.25;margin:0 0 8px}.sub{font-size:14px;opacity:.92}.userRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;background:rgba(255,255,255,.17);padding:10px 12px;border-radius:14px}.userName{font-weight:800}.ghostBtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 10px;font-weight:800}.progressCard{margin-top:12px;background:rgba(255,255,255,.18);padding:12px;border-radius:16px}.progressTop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:#fff;border-radius:999px;transition:.2s}.section,.addCard{margin-top:16px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.section h2,.addCard h2{font-size:18px;margin:0 0 10px}.item{padding:14px 4px;border-bottom:1px solid #eef2f7}.item:last-child{border-bottom:0}.itemTop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start}.itemCheck{width:23px;height:23px;accent-color:#0284c7;margin-top:2px}.txt{font-size:16px;line-height:1.4}.hint{display:block;font-size:12px;color:#64748b;margin-top:3px}.badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;margin-left:6px;vertical-align:2px}.deleteBtn{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 9px;font-size:12px;font-weight:800}.people{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 33px}.person{display:inline-flex;align-items:center;gap:4px;background:#e0f2fe;color:#0369a1;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.mine{background:#dcfce7;color:#15803d}.doneText{text-decoration:line-through;color:#94a3b8}.addGrid{display:grid;grid-template-columns:1fr auto;gap:8px}.textInput{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}.textInput:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}.addBtn{border:0;background:#0f172a;color:#fff;border-radius:12px;padding:0 16px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px}.primary{background:#0ea5e9;color:#fff}.secondary{background:#e2e8f0;color:#334155}.tip{font-size:13px;color:#475569;line-height:1.55;margin-top:16px;background:#f8fafc;border-radius:16px;padding:14px}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}.status{font-size:12px;margin-top:8px;opacity:.9}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalBox{width:min(420px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.modalBox h3{margin:0 0 6px;font-size:22px}.modalBox p{margin:0 0 16px;color:#64748b;font-size:14px;line-height:1.5}.modalBtn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#0ea5e9;color:#fff;margin-top:10px}@media(max-width:520px){.userRow{align-items:flex-start;flex-direction:column}.ghostBtn{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>💦 김해 롯데워터파크<br>커플 준비물 체크리스트</h1>
      <div class="sub">챙긴 항목을 체크하면 누가 챙겼는지 이름이 표시됩니다</div>
      <div class="userRow"><div>현재 사용자 · <span class="userName" id="currentUser">-</span></div><button class="ghostBtn" id="changeNameBtn">닉네임 변경</button></div>
      <div class="progressCard"><div class="progressTop"><span>준비 완료 항목</span><strong id="count">0 / 0</strong></div><div class="bar"><div id="bar"></div></div></div>
      <div class="status" id="syncStatus">서버 연결 중...</div>
    </section>
    <div id="sections"></div>
    <section class="addCard"><h2>➕ 체크리스트 추가</h2><div class="addGrid"><input class="textInput" id="newItemInput" maxlength="40" placeholder="예: 선글라스, 립밤, 슬리퍼"><button class="addBtn" id="addItemBtn">추가</button></div></section>
    <div class="actions"><button class="btn primary" id="checkMine">내가 전부 챙김</button><button class="btn secondary" id="reset">전체 체크 초기화</button></div>
    <div class="tip">한 항목을 여러 사람이 체크할 수 있습니다. 체크한 사람의 닉네임만 항목 아래에 표시됩니다. 다른 사람이 체크한 내용은 자동으로 동기화됩니다.</div>
    <div class="footer">체크 데이터는 Neon PostgreSQL에 공유 저장됩니다.</div>
  </div>
  <div class="modal" id="nicknameModal"><div class="modalBox"><h3>내 닉네임을 입력해주세요</h3><p>내가 체크한 준비물에 이 이름이 표시됩니다.</p><input class="textInput" id="nicknameInput" maxlength="12" placeholder="예: 국진"><button class="modalBtn" id="saveNicknameBtn">시작하기</button></div></div>

<script>
const NICKNAME_KEY='gimhae-waterpark-nickname-v1';
const API='/api/checklist';
const DEFAULTS=[
['ticket','🎫 입장 전 필수','모바일/온라인 입장권','예매 화면 또는 QR 미리 확인','필수'],['id','🎫 입장 전 필수','신분증','본인 확인이 필요한 경우 대비',''],['card','🎫 입장 전 필수','카드 또는 소액 현금','식사·대여·락커 비용 대비',''],['phone','🎫 입장 전 필수','휴대폰','',''],['swim','🩱 물놀이 용품','수영복 / 래시가드','','필수'],['cap','🩱 물놀이 용품','수영모·캡모자','현장 규정 확인용으로 챙겨두기',''],['aqua','🩱 물놀이 용품','아쿠아슈즈','뜨거운 바닥과 미끄럼 방지',''],['goggles','🩱 물놀이 용품','물안경','',''],['watercase','🩱 물놀이 용품','휴대폰 방수팩','','추천'],['sun','🧴 피부·샤워','워터프루프 선크림','야외 시설 이용 전 충분히 바르기','추천'],['wash','🧴 피부·샤워','샴푸·린스·바디워시','작은 여행용 용기에 담으면 편함',''],['cleanser','🧴 피부·샤워','클렌징폼 / 클렌징 제품','',''],['skin','🧴 피부·샤워','스킨·로션·기초 화장품','',''],['towel','🧴 피부·샤워','개인 수건','',''],['under','👕 갈아입을 옷','속옷','','필수'],['clothes','👕 갈아입을 옷','갈아입을 옷','',''],['socks','👕 갈아입을 옷','양말','',''],['bag','👕 갈아입을 옷','젖은 옷 담을 비닐/방수백','','추천'],['battery','🔋 있으면 편한 것','보조배터리','사진 많이 찍을 경우 추천',''],['hair','🔋 있으면 편한 것','머리끈·빗','',''],['glasses','🔋 있으면 편한 것','안경 케이스 / 렌즈용품','',''],['med','🔋 있으면 편한 것','개인 상비약·밴드','',''],['water','🔋 있으면 편한 것','마실 물','반입 규정에 맞는 용기인지 현장 규정 확인','']
].map(([id,section,text,hint,badge])=>({id,section,text,hint,badge,checkedBy:[],custom:false}));

let nickname=localStorage.getItem(NICKNAME_KEY)||'';
let items=DEFAULTS.map(v=>({...v,checkedBy:[]}));
let syncing=false;

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hasMine(item){return nickname && item.checkedBy.includes(nickname)}

async function api(body){
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error||'API 요청 실패');
  return res.json();
}

async function syncData(silent=false){
  if(syncing)return;
  syncing=true;
  try{
    const res=await fetch(API,{cache:'no-store'});
    if(!res.ok)throw new Error('서버 연결 실패');
    const data=await res.json();
    const custom=(data.customItems||[]).map(v=>({id:v.item_id,section:'➕ 추가한 준비물',text:v.text,hint:'',badge:'',checkedBy:[],custom:true}));
    items=[...DEFAULTS.map(v=>({...v,checkedBy:[]})),...custom];
    const map=new Map(items.map(i=>[i.id,i]));
    (data.checks||[]).forEach(c=>{const item=map.get(c.item_id);if(item&&!item.checkedBy.includes(c.nickname))item.checkedBy.push(c.nickname)});
    syncStatus.textContent='● 공유 데이터 동기화됨';
    render();
  }catch(e){
    syncStatus.textContent='⚠ 서버 연결 실패';
    if(!silent)alert('공유 서버에 연결하지 못했습니다.');
  }finally{syncing=false}
}

function render(){
  currentUser.textContent=nickname||'-';
  const groups={};items.forEach(i=>(groups[i.section]??=[]).push(i));
  const order=['🎫 입장 전 필수','🩱 물놀이 용품','🧴 피부·샤워','👕 갈아입을 옷','🔋 있으면 편한 것','➕ 추가한 준비물'];
  sections.innerHTML=order.filter(s=>groups[s]?.length).map(s=>`<section class="section"><h2>${esc(s)}</h2>${groups[s].map(itemHtml).join('')}</section>`).join('');
  bind();progress();
}

function itemHtml(i){
  const mine=hasMine(i),any=i.checkedBy.length>0;
  return `<div class="item" data-id="${esc(i.id)}"><div class="itemTop"><input class="itemCheck" type="checkbox" ${mine?'checked':''}><div class="txt ${any?'doneText':''}">${esc(i.text)}${i.badge?` <span class="badge">${esc(i.badge)}</span>`:''}${i.hint?`<span class="hint">${esc(i.hint)}</span>`:''}</div>${i.custom?'<button class="deleteBtn">삭제</button>':'<span></span>'}</div>${i.checkedBy.length?`<div class="people">${i.checkedBy.map(n=>`<span class="person ${n===nickname?'mine':''}">✓ ${esc(n)} 님이 챙김</span>`).join('')}</div>`:''}</div>`;
}

function bind(){
  document.querySelectorAll('.item').forEach(row=>{
    const id=row.dataset.id;
    row.querySelector('.itemCheck').onchange=async e=>{
      if(!nickname){e.target.checked=false;openModal();return}
      e.target.disabled=true;
      try{await api({action:e.target.checked?'check':'uncheck',itemId:id,nickname});await syncData(true)}catch(err){alert('체크 상태 저장에 실패했습니다.');await syncData(true)}
    };
    const del=row.querySelector('.deleteBtn');
    if(del)del.onclick=async()=>{
      const item=items.find(x=>x.id===id);
      if(confirm(`'${item.text}' 항목을 삭제할까요?`)){
        try{await api({action:'deleteItem',itemId:id});await syncData()}catch(e){alert('삭제에 실패했습니다.')}
      }
    };
  });
}

function progress(){const done=items.filter(i=>i.checkedBy.length>0).length,total=items.length;count.textContent=`${done} / ${total}`;bar.style.width=total?`${Math.round(done/total*100)}%`:'0%'}
function openModal(){nicknameInput.value=nickname||'';nicknameModal.classList.add('show');setTimeout(()=>nicknameInput.focus(),50)}
function saveNickname(){const n=nicknameInput.value.trim();if(!n){alert('닉네임을 입력해주세요.');return}nickname=n;localStorage.setItem(NICKNAME_KEY,n);nicknameModal.classList.remove('show');render()}
async function addItem(){const text=newItemInput.value.trim();if(!text){alert('추가할 준비물을 입력해주세요.');return}if(!nickname){openModal();return}const itemId='add-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);try{await api({action:'addItem',itemId,text,nickname});newItemInput.value='';await syncData()}catch(e){alert('항목 추가에 실패했습니다.')}}

changeNameBtn.onclick=openModal;
saveNicknameBtn.onclick=saveNickname;
nicknameInput.onkeydown=e=>{if(e.key==='Enter')saveNickname()};
addItemBtn.onclick=addItem;
newItemInput.onkeydown=e=>{if(e.key==='Enter')addItem()};
checkMine.onclick=async()=>{if(!nickname){openModal();return}try{await api({action:'checkAll',nickname,itemIds:items.map(i=>i.id)});await syncData()}catch(e){alert('전체 체크에 실패했습니다.')}};
reset.onclick=async()=>{if(confirm('모든 사람의 체크 기록을 초기화할까요?')){try{await api({action:'reset'});await syncData()}catch(e){alert('초기화에 실패했습니다.')}}};

render();
if(!nickname)openModal();
syncData();
setInterval(()=>syncData(true),3000);
</script>
</body>
</html>
