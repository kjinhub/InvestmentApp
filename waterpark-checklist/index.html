<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>김해 롯데워터파크 준비물 체크리스트</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:#0f172a;background:#e0f2fe}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff6ff 0,#f8fbff 40%,#fff 100%);min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0284c7,#22c55e);color:white;border-radius:24px;padding:22px 18px;box-shadow:0 14px 34px rgba(2,132,199,.18)}h1{font-size:25px;line-height:1.25;margin:0 0 8px}.sub{font-size:14px;opacity:.92}.progressCard{margin-top:14px;background:rgba(255,255,255,.18);padding:12px;border-radius:16px}.progressTop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:white;border-radius:999px;transition:.2s}.section{margin-top:16px;background:white;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.section h2{font-size:18px;margin:0 0 10px}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 8px;border-bottom:1px solid #eef2f7;cursor:pointer;-webkit-tap-highlight-color:transparent}.item:last-child{border-bottom:none}.item input{width:23px;height:23px;accent-color:#0284c7;flex:0 0 auto;margin-top:1px}.txt{font-size:16px;line-height:1.4}.hint{display:block;font-size:12px;color:#64748b;margin-top:3px}.item.done .txt{text-decoration:line-through;color:#94a3b8}.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;margin-left:6px;vertical-align:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#0ea5e9;color:#fff}.secondary{background:#e2e8f0;color:#334155}.tip{font-size:13px;color:#475569;line-height:1.55;margin-top:16px;background:#f8fafc;border-radius:16px;padding:14px}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>💦 김해 롯데워터파크<br>커플 준비물 체크리스트</h1>
    <div class="sub">8월 18일 화요일 · 챙긴 물건은 터치해서 체크</div>
    <div class="progressCard">
      <div class="progressTop"><span>준비 진행률</span><strong id="count">0 / 0</strong></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
  </section>
  <section class="section"><h2>🎫 입장 전 필수</h2>
    <label class="item"><input type="checkbox" data-id="ticket"><span class="txt">모바일/온라인 입장권 <span class="badge">필수</span><span class="hint">예매 화면 또는 QR 미리 확인</span></span></label>
    <label class="item"><input type="checkbox" data-id="id"><span class="txt">신분증<span class="hint">본인 확인이 필요한 경우 대비</span></span></label>
    <label class="item"><input type="checkbox" data-id="card"><span class="txt">카드 또는 소액 현금<span class="hint">식사·대여·락커 비용 대비</span></span></label>
    <label class="item"><input type="checkbox" data-id="phone"><span class="txt">휴대폰</span></label>
  </section>
  <section class="section"><h2>🩱 물놀이 용품</h2>
    <label class="item"><input type="checkbox" data-id="swim"><span class="txt">수영복 / 래시가드 <span class="badge">필수</span></span></label>
    <label class="item"><input type="checkbox" data-id="cap"><span class="txt">수영모·캡모자<span class="hint">현장 규정 확인용으로 챙겨두기</span></span></label>
    <label class="item"><input type="checkbox" data-id="aqua"><span class="txt">아쿠아슈즈<span class="hint">뜨거운 바닥과 미끄럼 방지</span></span></label>
    <label class="item"><input type="checkbox" data-id="goggles"><span class="txt">물안경</span></label>
    <label class="item"><input type="checkbox" data-id="watercase"><span class="txt">휴대폰 방수팩 <span class="badge">추천</span></span></label>
  </section>
  <section class="section"><h2>🧴 피부·샤워</h2>
    <label class="item"><input type="checkbox" data-id="sun"><span class="txt">워터프루프 선크림 <span class="badge">추천</span><span class="hint">야외 시설 이용 전 충분히 바르기</span></span></label>
    <label class="item"><input type="checkbox" data-id="wash"><span class="txt">샴푸·린스·바디워시<span class="hint">작은 여행용 용기에 담으면 편함</span></span></label>
    <label class="item"><input type="checkbox" data-id="cleanser"><span class="txt">클렌징폼 / 여성용 클렌징 제품</span></label>
    <label class="item"><input type="checkbox" data-id="skin"><span class="txt">스킨·로션·기초 화장품</span></label>
    <label class="item"><input type="checkbox" data-id="towel"><span class="txt">개인 수건<span class="hint">대여 여부와 관계없이 하나 있으면 편함</span></span></label>
  </section>
  <section class="section"><h2>👕 갈아입을 옷</h2>
    <label class="item"><input type="checkbox" data-id="under"><span class="txt">속옷 <span class="badge">필수</span></span></label>
    <label class="item"><input type="checkbox" data-id="clothes"><span class="txt">갈아입을 옷</span></label>
    <label class="item"><input type="checkbox" data-id="socks"><span class="txt">양말</span></label>
    <label class="item"><input type="checkbox" data-id="bag"><span class="txt">젖은 옷 담을 비닐/방수백 <span class="badge">추천</span></span></label>
  </section>
  <section class="section"><h2>🔋 있으면 편한 것</h2>
    <label class="item"><input type="checkbox" data-id="battery"><span class="txt">보조배터리<span class="hint">사진 많이 찍을 경우 추천</span></span></label>
    <label class="item"><input type="checkbox" data-id="hair"><span class="txt">머리끈·빗</span></label>
    <label class="item"><input type="checkbox" data-id="glasses"><span class="txt">안경 케이스 / 렌즈용품</span></label>
    <label class="item"><input type="checkbox" data-id="med"><span class="txt">개인 상비약·밴드</span></label>
    <label class="item"><input type="checkbox" data-id="water"><span class="txt">마실 물<span class="hint">반입 규정에 맞는 용기인지 현장 규정 확인</span></span></label>
  </section>
  <div class="actions"><button class="btn primary" id="all">전체 체크</button><button class="btn secondary" id="reset">초기화</button></div>
  <div class="tip">💡 <b>전날 밤 추천:</b> 입장권 QR, 수영복, 방수팩, 선크림, 속옷, 갈아입을 옷만큼은 한 가방에 먼저 넣어두면 빠뜨릴 가능성이 크게 줄어듭니다.</div>
  <div class="footer">체크 상태는 이 휴대폰 브라우저에 자동 저장됩니다.</div>
</div>
<script>
const KEY='gimhae-waterpark-check-v1';
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
function load(){let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};boxes.forEach(b=>{b.checked=!!s[b.dataset.id];paint(b)});update()}
function save(){const s={};boxes.forEach(b=>s[b.dataset.id]=b.checked);localStorage.setItem(KEY,JSON.stringify(s));update()}
function paint(b){b.closest('.item').classList.toggle('done',b.checked)}
function update(){boxes.forEach(paint);const n=boxes.filter(b=>b.checked).length;document.getElementById('count').textContent=`${n} / ${boxes.length}`;document.getElementById('bar').style.width=`${Math.round(n/boxes.length*100)}%`}
boxes.forEach(b=>b.addEventListener('change',save));
document.getElementById('all').onclick=()=>{boxes.forEach(b=>b.checked=true);save()};
document.getElementById('reset').onclick=()=>{boxes.forEach(b=>b.checked=false);save()};
load();
</script>
</body>
</html>
